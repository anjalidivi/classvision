
{% extends "base.html" %}

{% block content %}
<div style="max-width:430px; margin:60px auto; padding:35px; background:#17243a; border-radius:15px; color:white;">
    <h2 style="text-align:center;">Create Account</h2>
    <p style="text-align:center; color:#aab8cc;">Register for Classroom SNN</p>

    <form id="registerForm">
        <label>Username</label>
        <input type="text" id="username" required minlength="3"
               placeholder="Choose a username"
               style="width:100%; padding:12px; margin:10px 0 18px; box-sizing:border-box;">

        <label>Email</label>
        <input type="email" id="email" required
               placeholder="Enter your email"
               style="width:100%; padding:12px; margin:10px 0 18px; box-sizing:border-box;">

        <label>Password</label>
        <input type="password" id="password" required minlength="8"
               placeholder="Minimum 8 characters"
               style="width:100%; padding:12px; margin:10px 0 18px; box-sizing:border-box;">

        <button type="submit" style="width:100%; padding:13px; cursor:pointer;">
            Create Account
        </button>
    </form>

    <p id="message" style="text-align:center; margin-top:15px;"></p>

    <p style="text-align:center; margin-top:20px;">
        Already have an account?
        <a href="/login">Login here</a>
    </p>
</div>

<script>
document.getElementById("registerForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const message = document.getElementById("message");

    try {
        const response = await fetch("/api/auth/register", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                username: document.getElementById("username").value.trim(),
                email: document.getElementById("email").value.trim(),
                password: document.getElementById("password").value
            })
        });

        const result = await response.json();

        if (response.ok && result.success) {
            message.style.color = "#4ade80";
            message.textContent = "Account created! Redirecting to login...";
            setTimeout(() => {
                window.location.href = "/login";
            }, 1500);
        } else {
            message.style.color = "#f87171";
            message.textContent = result.message || "Registration failed.";
        }
    } catch (error) {
        message.style.color = "#f87171";
        message.textContent = "Unable to connect to the server.";
    }
});
</script>
{% endblock %}
